experiment:
  scenario: "sp"
  seed: 42

sumo:
  # calibrated: demanda medida nos vídeos de drone (Leste saturado, v/c ~1,0).
  # original: demanda do netedit, equilibrada entre as fases (v/c ~0,5).
  scenarios:
    calibrated: "../sumo/sp/Cruzamento.calibrated.sumocfg"
    original: "../sumo/sp/Cruzamento.sumocfg"
    # Mesmas demandas de veículos + pedestres (rede Cruzamento.ped.net.xml com
    # calçadas e faixas de pedestre; gerada por experiments.build_pedestrian_network).
    calibrated_ped: "../sumo/sp/Cruzamento.calibrated.ped.sumocfg"
    original_ped: "../sumo/sp/Cruzamento.ped.sumocfg"
  default_scenario: "calibrated"
  gui: false
  step_length: 1.0
  traci_port: 8873

unity:
  state_host: "127.0.0.1"
  state_port: 5004
  frame_host: "127.0.0.1"
  frame_port: 5005
  frame_timeout: 2.0
  frame_transport: "tcp"

traffic_light:
  id: "clusterJ0_J14_J2_J7"
  phase_count: 5
  phases:
    primary_green: 0
    primary_yellow: 1
    all_red: 2
    secondary_green: 3
    secondary_yellow: 4
    # Só na rede com pedestres (Cruzamento.ped.net.xml).
    pedestrian_green: 5
    pedestrian_clearance: 6

# Fase exclusiva de pedestres (só nos cenários *_ped): todos os veículos no
# vermelho e todas as faixas de pedestre no verde, a cada every_cycles ciclos
# (L/O → Sul → L/O → Sul → pedestres). O verde cobre o maior percurso em "L"
# (travessia + esquina + travessia vizinha = 48,05 m, esquina Sudoeste) a
# 1,2 m/s; a liberação é vermelho total. Valores de
# experiments.build_pedestrian_network.
pedestrians:
  every_cycles: 2
  walking_speed_mps: 1.2
  longest_l_m: 48.05
  green_seconds: 41
  clearance_seconds: 3
  # Recompensa de treino nos cenários *_ped: (1 − w)·veículos − w·pedestres,
  # com pedestres = min(1, soma da espera atual dos pedestres parados / ref.).
  # Sem este termo, o v3 aprendeu a segurar o verde para espaçar a fase de
  # pedestres (registro em docs/IMPLEMENTATION_PROGRESS.md).
  reward_weight: 0.3
  reward_waiting_reference_s: 1200  # p90 da soma com o ciclo fixo (calibrated_ped)

traffic_control:
  # Controlador heurístico inicial. Suas entradas são somente as filas visuais.
  min_green_seconds: 10
  max_green_seconds: 40
  yellow_seconds: 3
  all_red_seconds: 1
  switch_margin: 1

detectors:
  ids:
    - "e2_0" # E6_0
    - "e2_5" # E2_1
    - "e2_6" # E2_0
    - "e2_1" # E3_2
    - "e2_2" # E3_3
    - "e2_3" # E3_1
    - "e2_4" # E3_0

# Mapeamento explícito entre as ROIs calibradas no Unity e os detectores E2.
# Serve somente para comparar visão vs. verdade de terreno em avaliação offline.
vision_evaluation:
  lane_detector_mapping:
    south:
      lane_0: "e2_4" # E3_0
      lane_1: "e2_3" # E3_1
      lane_2: "e2_1" # E3_2
      lane_3: "e2_2" # E3_3
    east:
      lane_0: "e2_6" # E2_0
      lane_1: "e2_5" # E2_1
    west:
      lane_0: "e2_0" # E6_0

# Extensão física das ROIs de faixa das câmeras Unity ao longo de cada lane SUMO,
# em metros desde o início da lane (roi_end fica na linha de retenção). Medida por
# `python -m experiments.check_lane_geometry` a partir da pose/FOV exportados; um
# teste falha se a calibração mudar sem atualizar estes valores. As ROIs cobrem
# 60 m em todas as faixas (gerado por experiments.extend_lane_rois), mais que os
# E2 (42,6-45,8 m): as features por faixa usam este intervalo nas duas fontes
# (visão e TraCI), nunca o intervalo do E2.
lane_geometry:
  south:
    lane_0: {sumo_lane: "E3_0", roi_start_m: 17.9, roi_end_m: 77.9, width_m: 3.2}
    lane_1: {sumo_lane: "E3_1", roi_start_m: 17.9, roi_end_m: 77.9, width_m: 3.2}
    lane_2: {sumo_lane: "E3_2", roi_start_m: 17.9, roi_end_m: 77.9, width_m: 3.2}
    lane_3: {sumo_lane: "E3_3", roi_start_m: 17.9, roi_end_m: 77.9, width_m: 3.2}
  east:
    lane_0: {sumo_lane: "E2_0", roi_start_m: 8.4, roi_end_m: 68.4, width_m: 4.0}
    lane_1: {sumo_lane: "E2_1", roi_start_m: 8.4, roi_end_m: 68.4, width_m: 4.0}
  west:
    lane_0: {sumo_lane: "E6_0", roi_start_m: 14.5, roi_end_m: 74.5, width_m: 3.2}

# Parâmetros das features por faixa (vision/lane_features.py). "Parado" segue os
# padrões do E2 do SUMO (1,39 m/s por 1 s). oracle_noise degrada a fonte TraCI do
# pré-treino; visual_ground_offset_m corrige a posição do ponto de solo da bbox.
# Ambos são calibrados pela medição do domain gap visão × TraCI.
lane_state:
  kinematics:
    stop_speed_mps: 1.39
    stop_time_s: 1.0
    move_speed_mps: 2.0
    vehicle_length_m: 5.0
    ghost_ttl_s: 3.0
  visual_ground_offset_m: 0.0
  oracle_noise:
    position_std_m: 0.0
    drop_probability: 0.0
    untracked_probability: 0.0

# Veículos de emergência (sumo/emergency.py): inseridos por TraCI numa agenda
# reproduzível pela seed, depois do aquecimento, obedecendo ao semáforo (sem o
# dispositivo bluelight). O aviso V2I anuncia cada viatura announce_before_s
# antes de ela entrar na rede. A preempção assume o semáforo quando o tempo
# estimado até a linha de retenção fica abaixo de activation_eta_s; pode
# encurtar o verde mínimo, mas nunca pula amarelo nem all-red.
emergency:
  interval_s: 300
  jitter_s: 60
  first_after_s: 30
  announce_before_s: 15
  speed_factor: 1.0
  routes:
    south: [["E3", "E1"], ["E3", "E0"], ["E3", "E5"]]
    east: [["E2", "E0"], ["E2", "E5"]]
    west: [["E6", "E1"]]
  preemption:
    activation_eta_s: 20
  # Detecção visual (vision/visual_emergency.py): classe emergency dentro de uma
  # ROI em confirm_frames frames seguidos; sem vê-la, o pedido segue pelo tempo
  # estimado até a linha + hold_margin_s. A velocidade mínima da estimativa é a
  # mesma do V2I (metade da velocidade livre).
  visual_detection:
    confirm_frames: 2
    hold_margin_s: 3.0

dqn:
  model_path: "../results/models/visual-dqn-sp.pt"
  # v2: 7 faixas × (contagem, parados, ocupação, velocidade, espera) + 5 fases
  # + tempo da fase = 41. O v1 (13 contagens/fase) segue carregável pelos
  # checkpoints antigos; max_lane_count só vale para ele.
  state_version: 2
  state_size: 41
  max_speed_mps: 13.89
  waiting_reference_seconds: 60
  actions: ["keep", "switch"]
  max_lane_count: 10
  hidden_size: 64
  gamma: 0.90
  learning_rate: 0.001
  batch_size: 32
  replay_capacity: 50000
  min_replay_size: 256
  target_update_interval: 250
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995
