experiment:
  scenario: "sp"
  seed: 42

sumo:
  config_path: "../sumo/sp/Cruzamento.sumocfg"
  gui: false
  step_length: 1.0
  traci_port: 8873

unity:
  state_host: "127.0.0.1"
  state_port: 5004
  frame_host: "127.0.0.1"
  frame_port: 5005
  frame_timeout: 2.0
  frame_transport: "tcp"

traffic_light:
  id: "clusterJ0_J14_J2_J7"
  phase_count: 5
  phases:
    primary_green: 0
    primary_yellow: 1
    all_red: 2
    secondary_green: 3
    secondary_yellow: 4

detectors:
  ids:
    - "e2_0" # E6_0
    - "e2_5" # E2_1
    - "e2_6" # E2_0
    - "e2_1" # E3_2
    - "e2_2" # E3_3
    - "e2_3" # E3_1
    - "e2_4" # E3_0

dqn:
  model_path: "../models/dqn_traffic_model.keras"
  # 7 detectores x 5 features (fila, parados, ocupacao, velocidade, espera)
  # + one-hot de 5 fases + verde decorrido/pode trocar/deve trocar.
  # Definido em optimization/SP/sp_env.py:STATE_SIZE.
  state_size: 43
  detector_features:
    - "vehicle_count"
    - "halting_count"
    - "occupancy"
    - "mean_speed"
    - "lane_waiting_time"
